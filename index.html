 <!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GURU THE BRAND</title>

<style>
*{box-sizing:border-box;margin:0;padding:0}

body{
  min-height:100vh;
  display:flex;
  justify-content:center;
  align-items:center;
  padding:20px;
  background:#080808;
  color:white;
  font-family:Arial,sans-serif;
}

.card{
  width:100%;
  max-width:430px;
  padding:40px 25px;
  text-align:center;
  background:#151515;
  border:1px solid #333;
  border-radius:25px;
  box-shadow:0 20px 60px #000;
}

.logo{
  width:85px;
  height:85px;
  margin:auto;
  display:flex;
  align-items:center;
  justify-content:center;
  border-radius:50%;
  background:white;
  color:#111;
  font-size:23px;
  font-weight:bold;
}

.badge{
  display:inline-block;
  margin-top:20px;
  padding:8px 14px;
  border-radius:30px;
  background:#222;
  color:#ddd;
  font-size:13px;
}

.check{
  color:#22c55e;
}

h1{
  margin-top:22px;
  font-size:36px;
  font-weight:900;
}

p{
  margin:16px auto 25px;
  max-width:340px;
  color:#999;
  line-height:1.6;
}

.join{
  display:block;
  padding:17px;
  border-radius:14px;
  background:white;
  color:#111;
  text-decoration:none;
  font-weight:bold;
  font-size:16px;
}

.join:hover{
  transform:translateY(-2px);
}

.trust{
  margin-top:16px;
  color:#777;
  font-size:11px;
}

.dot{
  color:#22c55e;
}

.footer{
  margin-top:25px;
  padding-top:20px;
  border-top:1px solid #292929;
  color:#555;
  font-size:10px;
}
</style>
</head>

<body>

<div class="card">

  <div class="logo">GTB</div>

  <div class="badge">
    <span class="check">✓</span>
    Official Channel
  </div>

  <h1>GURU THE BRAND</h1>

  <p>
    Welcome to the official GURU THE BRAND channel.
    Join our Telegram community and stay connected.
  </p>

  <a
    class="join"
    href="https://t.me/+zm-nDu_ZD48zYmU1"
    onclick="trackSubscribe()"
  >
    ➤ &nbsp; JOIN TELEGRAM
  </a>

  <div class="trust">
    <span class="dot">●</span>
    Secure &amp; Official Telegram Link
  </div>

  <div class="footer">
    © 2026 GURU THE BRAND
  </div>

</div>

<script>
function trackSubscribe(){
  if(typeof fbq==="function"){
    fbq("track","Subscribe",{
      content_name:"GURU THE BRAND Telegram Channel",
      content_category:"Telegram"
    });
  }
}
</script>

</body>
</html>
